            type: select
            options:
              values: [Showreel, Film]
          - {name: role, label: Your role, type: string}
          - {name: videoUrl, label: YouTube / Vimeo / Instagram link, type: string}
          - name: thumbnail
            label: Custom thumbnail
            description: Leave empty to use the YouTube thumbnail automatically.
            type: image
          - {name: description, type: text}
          - {name: credits, hidden: true, type: text}
          - {name: featured, label: Show in the showreel section, type: boolean}
          - {name: placeholder, hidden: true, label: Mark as preview placeholder, type: boolean}
          - {name: coverText, hidden: true, label: Cover text when no thumbnail is available, type: string}
          - name: theme
            hidden: true
