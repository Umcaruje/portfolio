media:
  input: dist/assets
  output: assets
content:
  - name: editing
    label: Video Editing
    type: file
    path: dist/editing.json
    format: json
    fields:
      - name: projects
        label: Projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - {name: title, label: Project title, type: string, required: true}
          - {name: id, label: Project link slug (unique across the portfolio), type: string, hidden: true}
          - name: format
            label: Format
            type: select
            options:
              values: [Long-form, Short-form]
          - {name: role, label: Your role, type: string}
          - {name: videoUrl, label: YouTube / Vimeo / Instagram link, type: string}
          - name: thumbnail
            label: Custom thumbnail
            description: Leave empty to use the YouTube thumbnail automatically.
            type: image
          - {name: description, type: text}
          - {name: credits, hidden: true, type: text}
          - {name: placeholder, hidden: true, label: Mark as preview placeholder, type: boolean}
          - {name: coverText, hidden: true, label: Cover text when no thumbnail is available, type: string}
          - name: theme
            hidden: true
            label: Cover color when no thumbnail is available
            type: select
            options:
              values: [neutral, blue, dark, lilac]
          - name: images
            hidden: true
            label: Breakdown images
            type: image
            list: true
  - name: vfx
    label: VFX & Motion
    type: file
    path: dist/vfx.json
    format: json
    fields:
      - name: projects
        label: Projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - {name: title, label: Project title, type: string, required: true}
          - {name: id, label: Project link slug (unique across the portfolio), type: string, hidden: true}
          - name: format
            hidden: true
            label: Format
            type: select
            options:
              values: [VFX, Cleanup, Motion]
          - {name: role, label: Your role, type: string}
          - {name: videoUrl, label: YouTube / Vimeo / Instagram link, type: string}
          - name: thumbnail
            label: Custom thumbnail
            description: Leave empty to use the YouTube thumbnail automatically.
            type: image
          - {name: description, type: text}
          - {name: credits, hidden: true, type: text}
          - {name: featured, label: Show in the showreel section, type: boolean}
          - {name: placeholder, hidden: true, label: Mark as preview placeholder, type: boolean}
          - {name: coverText, hidden: true, label: Cover text when no thumbnail is available, type: string}
          - name: theme
            hidden: true
            label: Cover color when no thumbnail is available
            type: select
            options:
              values: [neutral, blue, dark, lilac]
          - name: images
            hidden: true
            label: Breakdown images
            type: image
            list: true
  - name: music
    label: Music Production
    type: file
    path: dist/music.json
    format: json
    fields:
      - {name: soundcloudEmbedUrl, label: SoundCloud playlist embed URL, type: string}
      - name: projects
        label: Projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - {name: title, label: Project title, type: string, required: true}
          - {name: id, label: Project link slug (unique across the portfolio), type: string, hidden: true}
          - name: format
            hidden: true
            label: Format
            type: select
            options:
              values: [Composition, Production]
          - {name: role, label: Your role, type: string}
          - {name: videoUrl, label: YouTube / Vimeo / Instagram link, type: string}
          - name: thumbnail
            label: Custom thumbnail
            description: Leave empty to use the YouTube thumbnail automatically.
            type: image
          - {name: description, type: text}
          - {name: credits, hidden: true, type: text}
          - {name: placeholder, hidden: true, label: Mark as preview placeholder, type: boolean}
          - {name: coverText, hidden: true, label: Cover text when no thumbnail is available, type: string}
          - name: theme
            hidden: true
            label: Cover color when no thumbnail is available
            type: select
            options:
              values: [neutral, blue, dark, lilac]
          - name: images
            hidden: true
            label: Breakdown images
            type: image
            list: true
  - name: ai
    label: AI Video
    type: file
    path: dist/ai.json
    format: json
    fields:
      - name: projects
        label: Projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - {name: title, label: Project title, type: string, required: true}
          - {name: id, label: Project link slug (unique across the portfolio), type: string, hidden: true}
          - name: format
