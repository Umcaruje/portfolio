media:
  input: dist/assets
  output: assets
content:
  - name: portfolio
    label: Portfolio content
    type: file
    path: dist/content.json
    format: json
    fields:
      - name: soundcloudEmbedUrl
        label: SoundCloud player URL (iframe src)
        type: string
      - name: projects
        label: Projects
        type: object
        list: true
        fields:
          - {name: id, label: Unique project slug, type: string, required: true}
          - {name: title, label: Project title, type: string, required: true}
          - name: section
            type: select
            options:
              values: [editing, vfx, music, ai]
          - name: format
            type: select
            options:
              values: [Long-form, Short-form, VFX, Cleanup, Motion, Composition, Production, Showreel, Film]
          - {name: role, label: Your role, type: string}
          - {name: thumbnail, type: image}
          - {name: videoUrl, label: YouTube or Vimeo link, type: string}
          - {name: description, type: text}
          - {name: credits, type: text}
          - {name: featured, label: Feature as a showreel (VFX or AI), type: boolean}
          - {name: placeholder, label: Mark as preview placeholder, type: boolean}
          - {name: coverText, label: Cover text when no thumbnail, type: string}
          - name: theme
            type: select
            options:
              values: [neutral, blue, dark, lilac]
          - name: images
            label: Breakdown images
            type: image
            list: true
